name: Request OpenDota parses

# Periodically asks OpenDota to parse a tracked account's newest match(es),
# so "in-depth" match data (gold/XP graphs, purchase log, chat, etc.) shows
# up on the dashboard without manually clicking "Request parse" after every
# game - and saves those matches (plus the indexes and profile.json the
# site reads) to the data branch, since the site only ever reads from there.
#
# Deliberately uses the free/anonymous OpenDota tier, not the paid
# OPENDOTA_API_KEY secret (see export-matches.yml for that) - this job
# only ever makes 1-3 calls per run at low, steady-paced volume (unlike
# export's tight loop of thousands of calls, which is what actually needs
# a metered key to avoid shared-runner-IP throttling). At a few games a
# day, free-tier limits are not a concern here, so this stays $0.
#
# Also cost/commit-aware for its own sake: tracks the highest match_id
# already handled in .github/request-parse-state.json, and only spends a
# /request call on match_ids newer than that - a quiet run (no new match
# since last check) costs exactly one list call, not a re-request of the
# same matches every time. State only gets committed when something
# actually changed, so this doesn't spam commits either.
#
# Also runnable by hand (Actions tab -> this workflow -> Run workflow) with
# force_recheck=true to re-request the last `limit` matches regardless of
# state - useful once, right after setting this up, to grab whatever
# replays Valve still happens to have (usually ~8-14 days post-match; older
# unparsed matches can no longer be parsed no matter what).

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      account_id:
        description: "OpenDota account_id (32-bit) to request parses for"
        default: "90031862"
      limit:
        description: "How many of the most recent matches to check"
        default: "10"
      force_recheck:
        description: "Re-request all of them regardless of state, ignoring what's already been handled"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  request-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # For updating matches-index.json alongside the state file below -
      # that index lives on the data branch next to the exported match
      # JSON (see export-matches.yml), not on main.
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Request parses for new matches only
        env:
          ACCOUNT_ID: ${{ github.event.inputs.account_id || '90031862' }}
          LIMIT: ${{ github.event.inputs.limit || '10' }}
          FORCE_RECHECK: ${{ github.event.inputs.force_recheck || 'false' }}
        run: |
          set -uo pipefail
          STATE_FILE=".github/request-parse-state.json"

          # No api_key param on purpose - see the free-tier note above.
          api_key_arg=()

          last_seen=0
          if [ -f "$STATE_FILE" ]; then
            last_seen=$(jq -r '.last_seen_match_id // 0' "$STATE_FILE")
          fi

          echo "Fetching last $LIMIT matches for account $ACCOUNT_ID (last seen: $last_seen)..."
          matches=$(curl -sS -G --connect-timeout 10 --max-time 30 "https://api.opendota.com/api/players/$ACCOUNT_ID/matches" \
            --data-urlencode "limit=$LIMIT" "${api_key_arg[@]}")

          # Saved for the index-update step below, which runs after this
          # one commits/pushes its own state to main - keeping them as
          # separate steps/commits rather than juggling two branches'
          # worth of changes in one. Guarded against a malformed/empty
          # response so that step's jq merge never chokes on bad input.
          if echo "$matches" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "$matches" > /tmp/request-parse-matches.json
          else
            echo "[]" > /tmp/request-parse-matches.json
          fi

          match_ids=$(echo "$matches" | jq -r 'if type=="array" then sort_by(.match_id) | .[].match_id else empty end')

          if [ -z "$match_ids" ]; then
            echo "No matches returned - check the account_id and that 'Expose Public Match Data' is on in the Dota 2 client."
            exit 0
          fi

          new_max=$last_seen
          requested=0
          for id in $match_ids; do
            if [ "$id" -gt "$new_max" ]; then new_max=$id; fi
            if [ "$id" -le "$last_seen" ] && [ "$FORCE_RECHECK" != "true" ]; then
              continue
            fi
            echo "Requesting parse for match $id"
            curl -sS -G --connect-timeout 10 --max-time 30 -X POST "https://api.opendota.com/api/request/$id" "${api_key_arg[@]}" -o /dev/null || true
            requested=$((requested + 1))
            sleep 1.2
          done

          echo "Requested parses for $requested match(es) this run. last_seen_match_id: $last_seen -> $new_max"

          cat > "$STATE_FILE" <<JSON
          {"account_id": $ACCOUNT_ID, "last_seen_match_id": $new_max, "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          JSON

      - name: Commit state (only when something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/request-parse-state.json
          if ! git diff --cached --quiet; then
            git commit -m "New match detected, parse requested"
            git push
          else
            echo "No new matches - nothing to commit."
          fi

      - name: Update match data on the data branch
        working-directory: data-branch
        env:
          ACCOUNT_ID: ${{ github.event.inputs.account_id || '90031862' }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts="$GITHUB_WORKSPACE/.github/scripts"

          # --- 1. Match list index -------------------------------------
          # Same list this run already fetched to check for new matches -
          # merge it into the existing index rather than re-fetching, so
          # this costs no extra API call. Only ever adds/refreshes entries.
          #
          # existing is read via --slurpfile (not into a shell variable
          # passed through --argjson) since matches-index.json is thousands
          # of matches - large enough that passing it as a command-line
          # argument hits the OS's ARG_MAX ("Argument list too long").
          # Written to a temp file first since the shell would otherwise
          # truncate matches-index.json before jq reads it.
          if [ ! -f matches-index.json ]; then
            echo "[]" > matches-index.json
          fi
          jq -c -n --slurpfile existing matches-index.json --slurpfile fresh /tmp/request-parse-matches.json \
              '($fresh[0] + $existing[0]) | unique_by(.match_id) | sort_by(.match_id) | reverse' > matches-index.json.tmp
          mv matches-index.json.tmp matches-index.json

          # --- 2. Full match JSON for new / not-yet-parsed matches -----
          # The dashboard reads match details only from this branch (it
          # never silently falls back to OpenDota), so new games need their
          # full JSON saved here without waiting on a manual
          # export-matches.yml run. A game that's still unparsed (no
          # "version" yet - the parse this workflow just requested takes a
          # few minutes) gets re-fetched on later runs, but only for 6 hours
          # after it started - past that it's almost certainly never going
          # to parse (e.g. the replay wasn't available), and re-fetching it
          # every 20 minutes forever would just burn free-tier calls.
          now=$(date +%s)
          saved_ids=()
          mapfile -t candidates < <(jq -r '.[] | "\(.match_id) \(.start_time)"' /tmp/request-parse-matches.json)
          for line in "${candidates[@]}"; do
            read -r id start_time <<< "$line"
            file="matches/${id: -2}/$id.json"
            if [ -f "$file" ]; then
              if jq -e '.version != null' "$file" > /dev/null 2>&1; then
                continue # already have the parsed version
              fi
              if [ $(( now - start_time )) -gt 21600 ]; then
                continue # unparsed, but too old to keep retrying
              fi
            fi

            status=$(curl -sS -G --connect-timeout 10 --max-time 30 -o /tmp/match.json -w "%{http_code}" \
                "https://api.opendota.com/api/matches/$id" || echo "000")
            sleep 1.2
            if [ "$status" != "200" ] || ! jq -e '.match_id' /tmp/match.json > /dev/null 2>&1; then
              echo "  match $id: HTTP $status, skipping for now"
              continue
            fi
            mkdir -p "$(dirname "$file")"
            jq -c '.' /tmp/match.json > "$file"
            saved_ids+=("$id")
            echo "  saved match $id (parsed: $(jq -r '.version != null' "$file"))"
          done

          # --- 3. Incremental extras/players index updates -------------
          # Same jq filters export-matches.yml's full rebuild uses (from
          # main's .github/scripts/), applied to just the files saved above
          # and merged in over any older entry for the same match.
          if [ "${#saved_ids[@]}" -gt 0 ]; then
            for index in match-extras-index match-players-index; do
              filter="$scripts/${index%-index}.jq" # e.g. match-extras.jq
              : > /tmp/new-entries.jsonl
              for id in "${saved_ids[@]}"; do
                jq -c -f "$filter" "matches/${id: -2}/$id.json" >> /tmp/new-entries.jsonl
              done
              if [ ! -f "$index.json" ]; then
                echo "[]" > "$index.json"
              fi
              jq -c -n --slurpfile existing "$index.json" --slurpfile fresh <(jq -s '.' /tmp/new-entries.jsonl) \
                  '($fresh[0] + $existing[0]) | unique_by(.match_id) | sort_by(.match_id) | reverse' > "$index.json.tmp"
              mv "$index.json.tmp" "$index.json"
            done
            git add matches match-extras-index.json match-players-index.json
          fi

          # --- 4. Profile ----------------------------------------------
          # Name/avatar/rank for the site header. Rarely changes, so only
          # refreshed when a new game was just saved (or if it's missing),
          # not on every quiet 20-minute run.
          if [ "${#saved_ids[@]}" -gt 0 ] || [ ! -f profile.json ]; then
            if curl -sS -G --connect-timeout 10 --max-time 30 -o /tmp/profile.json \
                "https://api.opendota.com/api/players/$ACCOUNT_ID" \
                && jq -e '.profile.account_id' /tmp/profile.json > /dev/null 2>&1; then
              jq -c '.' /tmp/profile.json > profile.json
            else
              echo "Profile fetch failed - keeping the existing profile.json."
            fi
          fi

          git add matches-index.json
          [ -f profile.json ] && git add profile.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Update match data [skip ci]"
            # Retries with a rebase on conflict - a long export-matches.yml
            # run pushes to this same branch periodically too, so the two
            # can genuinely collide (a plain rejected push would otherwise
            # fail this step outright instead of just retrying).
            for attempt in 1 2 3; do
              if git push -q; then
                break
              fi
              echo "Push rejected (probably export-matches.yml pushed in the meantime) - rebasing and retrying ($attempt/3)..."
              git pull --rebase -q
            done
          else
            echo "Nothing changed."
          fi
